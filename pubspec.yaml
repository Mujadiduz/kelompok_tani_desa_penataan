name: kelompok_tani_desa_penataan
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.15.2
  firebase_database: ^11.3.7
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.1

  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

  pdf: ^3.11.0
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/Icon-Apps.png"
  min_sdk_android: 21
  remove_alpha_ios: true